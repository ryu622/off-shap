[project]
name = "off-shap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kloppy>=3.19.0",
    "matplotlib>=3.11.2",
    "mplsoccer>=1.8.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
stage2 = [
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/off_shap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
